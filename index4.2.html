   ['nublado','frio','frio','lluvia','soleado'];

  dm41Online.writer=setInterval(()=>dm41Publish(false),180);
  dm41Online.heartbeat=setInterval(()=>dm41Publish(true),15000);
  try{localStorage.setItem(DM41_URL_KEY,url)}catch(_){}
  await dm41Publish(true);
  dm42OnlineStart();
  dm41SetStatus('¡Conectado! Ya puedes explorar mientras esperas al otro jugador.',true);
 }catch(err){
  dm41SetStatus('No se pudo conectar: '+dm41SafeText(err.message||err));
  dm41Online.connected=false;dm41Online.uid=null;
 }finally{dm41Online.connecting=false}
}
function dm41Snapshot(){
 if(!state)return null;
 return {name:dm41SafeText(state.name||'Jugador'),x:Math.round(Number(state.x)||144),y:Math.round(Number(state.y)||252),
 room:indoor?String(indoor).slice(0,28):'',place:indoor?String(indoor):tab==='world'?'la ciudad':String(tab),

}
async function dm41Publish(force){
 const c=dm41Online;if(!c.connected||!c.db||!c.uid||!state)return;
 const data=dm41Snapshot();if(!data)return;
 const sig=[data.x,data.y,data.room,data.roomX,data.roomY,data.face,data.name,data.place].join(':');
 if(!force&&sig===c.lastSig)return;
 const now=Date.now();if(!force&&now-c.lastSend<150)return;
 c.lastSend=now;c.lastSig=sig;
 try{await c.api.dbMod.set(c.api.dbMod.ref(c.db,'dosMundos/duo/presence/'+c.uid),data)}
 catch(err){dm41SetStatus('Error de sincronización: '+dm41SafeText(err.message));c.lastSig=''}
}
async function dm41Disconnect(){
 dm42OnlineStop();

 if(c.writer)clearInterval(c.writer);if(c.heartbeat)clearInterval(c.heartbeat);c.writer=null;c.heartbeat=null;
 if(c.off){c.off();c.off=null}if(c.connOff){c.connOff();c.connOff=null}
 if(c.db&&c.uid&&c.api){
  try{await c.api.dbMod.remove(c.api.dbMod.ref(c.db,'dosMundos/duo/presence/'+c.uid))}catch(_){}
 }
 if(c.auth&&c.api){try{await c.api.authMod.signOut(c.auth)}catch(_){}}
 c.other=null;c.uid=null;c.remoteUid=null;c.lastSig='';
 if(c.trigger){c.trigger.textContent='● Online';c.trigger.classList.remove('is-connected')}
 if(document.getElementById('dm41-presence'))document.getElementById('dm41-presence').textContent='Sesión desconectada.';
 dm41SetStatus('Sesión desconectada');

}

function dm42OnlineStart(){
 dm42OnlineStop();if(!dm42Connected())return;
 const dbm=dm41Online.api.dbMod;
 try{
  const messages=dbm.query(dm42Db('messages'),dbm.limitToLast(65));
  dm42Social.stop.push(dbm.onValue(messages,s=>{
   dm42Social.msgs=Object.entries(s.val()||{}).map(([id,v])=>({id,...v})).filter(m=>m&&typeof m.text==='string').sort((a,b)=>(a.created||0)-(b.created||0));
   dm42PhoneRender();
  },e=>dm42UpdateInfo('Mensajes: '+e.message+' · Revisa las reglas de Firebase 4.2.')));
  const invitations=dbm.query(dm42Db('invites'),dbm.limitToLast(50));
  dm42Social.stop.push(dbm.onValue(invitations,s=>{
   dm42Social.invites=Object.entries(s.val()||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(b.created||0)-(a.created||0));
   dm42PhoneRender();dm42DateRefresh();
  },e=>dm42UpdateInfo('Invitaciones: '+e.message+' · Revisa las reglas de Firebase 4.2.')));
  dm42Social.ready=true;dm42PhoneRender();dm42DateRefresh();
 }catch(e){dm42UpdateInfo('Error de conexión social: '+e.message)}
}
async function dm42SendMessage(raw){
 if(!dm42Connected())throw Error('Conéctate primero en ● Online.');
 const body=String(raw||'').trim();if(!body)throw Error('Escribe primero un mensaje.');
 if(body.length>180)throw Error('Máximo 180 caracteres por mensaje.');
 const c=dm41Online,dbm=c.api.dbMod,push=dbm.push(dm42Db('messages'));
 await dbm.set(push,{from:c.uid,to:dm42Remote(),text:body,created:Date.now()});
}
async function dm42SendInvite(){
 if(!dm42Connected())throw Error('Conéctate primero en ● Online.');
 const c=dm41Online,dbm=c.api.dbMod,push=dbm.push(dm42Db('invites'));
 await dbm.set(push,{from:c.uid,to:dm42Remote(),place:'restaurant',status:'pending',created:Date.now(),updatedAt:Date.now()});
}
async function dm42Reply(invite,status){
 if(!dm42Connected())throw Error('Conéctate primero en ● Online.');
 if(invite.to!==dm41Online.uid||invite.status!=='pending')throw Error('Esta invitación ya no está pendiente.');
 await dm41Online.api.dbMod.update(dm42Db('invites/'+invite.id),{status,updatedAt:Date.now()});
 if(status==='accepted')dm42OpenRestaurant(invite.id);
}

    "['☕ Tomar café (-5 €)', ()=>shortAction(()=>doAction('coffee'))]",
    "['☕ Abrir carta interactiva', ()=>dm37OpenCafe()]"
  );
  game = game.replace(
    "['🥐 Comer algo (-9 €)', ()=>shortAction(()=>{ if(!spend(9)) return; state.hunger=clamp(state.hunger+22); state.fun=clamp(state.fun+6); advance(25); refreshUI(); notice('Te quedaste un rato en la cafetería.'); })]",
    "['🎵 Planes y experiencias', ()=>dm37OpenCafe()]"
  );
  // Metro integration into the existing station's entry, objects and travel action.
  game = game.replace('function openPlace(id){', 'function openPlace(id){if(id==="station")setTimeout(()=>dm38OpenMetro(),120);');
  game = game.replace('function triggerRoomAction(i){', 'function triggerRoomAction(i){if(indoor==="station"){dm38OpenMetro();return;}');
  game = game.replace("case'travel':tab='travel';", "case'travel':dm38OpenMetro();return;case'travel-original':tab='travel';");
  game = game.replace("['🚉 Ir a viajar', ()=>shortAction(()=>doAction('travel'))]", "['🚇 Abrir mapa del metro', ()=>dm38OpenMetro()]");
  game = game.replace('function recalcMood(){', 'const dm40AdvanceBase=advance; advance=function(mins){dm40AdvanceBase(mins);dm40EffectsAfterTime(mins)};\nfunction recalcMood(){');
  game = game.replace("  drawText(g,meta.label,30,22,'#243347',12,'left');\n}", "  drawText(g,meta.label,30,22,'#243347',12,'left');\n  dm41DrawRoom(g,id);\n}");
  // Original 2.9 charges 12€ for an in-game cinema action.
  // Replace only that action with the external streaming chooser,
  // covering cinema buttons AND interior objects.
  const cinemaMarker = "case'cinema':if(!spend(12))";
  if (!game.includes(cinemaMarker)) throw new Error('No se encontró la acción del cine en la base 2.9.');
  game = game.replace(cinemaMarker, "case'cinema':dm33OpenCinema();return;case'cinema-original':if(!spend(12))");
  game = game.replace('  interiorDetail28(g,id);', '  dm33RoomDetails(g,id);\n  interiorDetail28(g,id);');
  game = game.replace('  dm33RoomDetails(g,id);', '  dm33RoomDetails(g,id); if(id===\'cafe\') dm37CafeArt(g);');
  game = game.replace('  interiorDetail28(g,id);', '  if(id===\'home\')dm40RoomDecor(g);\n  interiorDetail28(g,id);');
  game = game.replace(" drawRect(g,0,0,160,200,'#94bfd2');",' dm33EditorBackdrop(g);');
  // Keep a reversible switch: update only the 3.4 render path. No save writes.
  const css = document.getElementById('dm-style-source').textContent;
  game = game.replace('</head>','<style id="dm33style">'+css+'</style></head>');
  game = game.replace('</body>','<div id="dm33Badge">✦ DOS MUNDOS · VIDA COMPARTIDA 4.2</div><div id="dm33Bar"><button type="button" id="dm33Toggle">◐ Diseño: 4.2</button></div></body>');
  game = game.replace('preview(); buildLists(); loadState();', `preview(); buildLists(); loadState(); dm381InstallMusic(); dm39InstallArcade(); dm40Install(); dm41Install(); dm42Install();
  (()=>{let active=true;const btn=document.getElementById('dm33Toggle');if(!btn)return;
   btn.addEventListener('click',()=>{active=!active;const style=document.getElementById('dm33style');style.disabled=!active;
    if(active){drawMap=dm33drawMap;btn.textContent='◐ Diseño: 4.2';}
    else {btn.textContent='◐ Diseño: 4.2 (pulsa para activar)';}
   });
  })();`);
  // Avoid srcdoc accidentally closing at HTML parse boundaries inside this launcher.
  frame.srcdoc = game;
  frame.addEventListener('load',()=>status.style.display='none',{once:true});
 }catch(err){
  status.innerHTML='<strong>No se pudo cargar Vida Compartida 4.2.</strong><p>'+String(err.message).replace(/[<>&]/g,'')+'</p><p>La versión 2.9 no ha sido modificada.</p>';
 }
})();
</script></body></html>
