<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Dos Mundos</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1423;color:#f4f6fb;font:16px system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;padding:22px 18px 80px}h1{font-size:34px;margin:12px 0 6px}h2{font-size:24px}p{color:#bbc6da;line-height:1.5}.tag{color:#a8d9ce;letter-spacing:.15em;text-transform:uppercase;font-size:12px}.panel{background:#192438;border:1px solid #34415a;border-radius:20px;padding:20px;margin:16px 0}label{display:block;margin:16px 0 7px;color:#d8e0f0;font-weight:600}input,select{width:100%;border:1px solid #55637b;background:#0f192a;color:white;border-radius:12px;padding:15px;font-size:16px}button{cursor:pointer;width:100%;padding:16px;border:0;border-radius:14px;background:#a8dfca;color:#11251f;font-weight:800;font-size:16px;margin-top:16px}button.secondary{background:#2c3951;color:white}button:disabled{opacity:.5}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#25324a;border-radius:12px;padding:12px;text-align:center;font-size:13px}.stat b{display:block;font-size:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button{font-size:14px;margin:0;padding:13px 6px}.notice{color:#a8dfca;min-height:24px}.city{padding:12px;border-bottom:1px solid #34415a}.city:last-child{border:0}.muted{font-size:13px;color:#9daac0}</style></head><body><main><div class="tag">Una vida, dos historias</div><h1>Dos Mundos</h1><p>Empieza tu historia en Madrid. Decide dónde vivir, qué hacer y adónde viajar.</p><section id="setup" class="panel"><h2>Crea tu personaje</h2><label for="name">Tu nombre</label><input id="name" maxlength="30" placeholder="¿Cómo te llamas?" autocomplete="off"><label for="district">Tu barrio en Madrid</label><select id="district"><option>Chamberí</option><option>Malasaña</option><option>Lavapiés</option><option>Salamanca</option><option>Retiro</option><option>La Latina</option><option>Ciudad Lineal</option><option>Carabanchel</option><option>Vallecas</option><option>Otro barrio de Madrid</option></select><label for="home">Tu primera vivienda</label><select id="home"><option value="Habitación compartida">Habitación compartida</option><option value="Estudio pequeño">Estudio pequeño</option><option value="Piso compartido">Piso compartido</option><option value="Apartamento propio">Apartamento propio</option></select><button id="start" type="button">Comenzar vida →</button><p id="error" role="alert"></p></section><section id="game" class="hidden"><div class="panel"><div class="tag" id="day"></div><h2 id="greeting"></h2><p id="location"></p><div class="stats"><div class="stat">Dinero<b id="money"></b></div><div class="stat">Energía<b id="energy"></b></div><div class="stat">Ánimo<b id="mood"></b></div></div></div><div class="panel"><h2>¿Qué hacemos hoy?</h2><div class="choices"><button data-action="work">💼 Trabajar</button><button data-action="rest">🛌 Descansar</button><button data-action="walk">🌳 Pasear</button><button data-action="social">☕ Socializar</button></div><p class="notice" id="notice" aria-live="polite"></p></div><div class="panel"><h2>Explora España</h2><p>Empiezas en Madrid, pero puedes viajar y mudarte.</p><div id="cities"></div></div><button class="secondary" id="reset">Crear otra vida</button></section></main><script>const $=id=>document.getElementById(id),key='dos-mundos-v1';let state=null;const cities=['Madrid','Barcelona','Valencia','Sevilla','Bilbao','Málaga'];function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function render(){if(!state)return;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('day').textContent='Día '+state.day;$('greeting').textContent='Hola, '+state.name;$('location').textContent=state.city==='Madrid'?state.home+' · '+state.district+', Madrid':state.home+' · '+state.city;$('money').textContent=state.money+' €';$('energy').textContent=state.energy+'/100';$('mood').textContent=state.mood+'/100';$('cities').innerHTML='';cities.forEach(city=>{let div=document.createElement('div');div.className='city';let title=document.createElement('strong');title.textContent=city+(city===state.city?' · Estás aquí':'');div.append(title);if(city!==state.city){let b=document.createElement('button');b.className='secondary';b.textContent='Viajar a '+city+' · 60 €';b.disabled=state.money<60;b.onclick=()=>{state.money-=60;state.city=city;state.energy=Math.max(0,state.energy-15);state.day++;$('notice').textContent='Has llegado a '+city+'.';save();render()};div.append(b)}$('cities').append(div)})}function clamp(x){return Math.max(0,Math.min(100,x))}$('start').addEventListener('click',()=>{const name=$('name').value.trim();if(!name){$('error').textContent='Escribe tu nombre para comenzar.';$('name').focus();return}state={name,district:$('district').value,home:$('home').value,city:'Madrid',day:1,money:350,energy:85,mood:75};save();render()});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{if(!state)return;let message='';switch(b.dataset.action){case'work':if(state.energy<20){message='Necesitas descansar antes de trabajar.';break}state.money+=65;state.energy=clamp(state.energy-25);state.mood=clamp(state.mood-5);message='Has trabajado y ganado 65 €.';break;case'rest':state.energy=clamp(state.energy+45);state.mood=clamp(state.mood+5);message='Has recuperado energía.';break;case'walk':state.energy=clamp(state.energy-10);state.mood=clamp(state.mood+18);message='Un paseo te ha sentado bien.';break;case'social':if(state.money<15){message='No tienes dinero suficiente.';break}state.money-=15;state.energy=clamp(state.energy-10);state.mood=clamp(state.mood+25);message='Has pasado una buena tarde.';break}if(!message.startsWith('Necesitas')&&!message.startsWith('No tienes'))state.day++;$('notice').textContent=message;save();render()}));$('reset').onclick=()=>{if(confirm('¿Borrar esta partida y empezar otra vida?')){localStorage.removeItem(key);location.reload()}};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved.name==='string'&&cities.includes(saved.city)){state=saved;render()}}catch(e){}</script></body></html>
