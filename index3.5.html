 } else if(id==='gym'){

(async () => {
 const status = document.getElementById('dm-status');
 const frame = document.getElementById('dm-frame');
 try {
  const res = await fetch('./index2.9.html',{cache:'no-cache'});
  if(!res.ok)throw new Error('No se encuentra index2.9.html ('+res.status+')');
  let game = await res.text();
  if(!game.includes('function drawMap(){') || !game.includes('function renderInteriorScene(id)') || !game.includes('function drawEditor23()')){
    throw new Error('La base 2.9 cambió; no se aplicará un parche incompatible.');
  }
  // Inject into the original JavaScript closure. The replacement is deliberately
  // constrained to exact markers, so game logic, saves, hotspots and routing remain intact.
  const injected = document.getElementById('dm-art-source').textContent;
  game = game.replace('function drawMap(){', injected+'\nfunction drawMap(){dm33drawMap();return;');
  game = game.replace('function drawCitizens(g){', 'const dm34SpriteBase=sprite25; sprite25=function(g,x,y,scale,look={},frame=0,facing="down"){dm34SpriteBase(g,x,y,scale,look,frame,facing);dm34SpriteFinish(g,x,y,scale,look,frame,facing)};\nfunction drawCitizens(g){');
  // Original 2.9 charges 12€ for an in-game cinema action.
  // Replace only that action with the external streaming chooser,
  // covering cinema buttons AND interior objects.
  const cinemaMarker = "case'cinema':if(!spend(12))";
  if (!game.includes(cinemaMarker)) throw new Error('No se encontró la acción del cine en la base 2.9.');
  game = game.replace(cinemaMarker, "case'cinema':dm33OpenCinema();return;case'cinema-original':if(!spend(12))");
  game = game.replace('  interiorDetail28(g,id);', '  dm33RoomDetails(g,id);\n  interiorDetail28(g,id);');
  game = game.replace(" drawRect(g,0,0,160,200,'#94bfd2');",' dm33EditorBackdrop(g);');
  // Keep a reversible switch: update only the 3.4 render path. No save writes.
  const css = document.getElementById('dm-style-source').textContent;
  game = game.replace('</head>','<style id="dm33style">'+css+'</style></head>');
  game = game.replace('</body>','<div id="dm33Badge">✦ DOS MUNDOS · BARRIO VIVO PLUS 3.5</div><div id="dm33Bar"><button type="button" id="dm33Toggle">◐ Diseño: 3.5</button></div></body>');
  game = game.replace('preview(); buildLists(); loadState();', `preview(); buildLists(); loadState();
  (()=>{let active=true;const btn=document.getElementById('dm33Toggle');if(!btn)return;
   btn.addEventListener('click',()=>{active=!active;const style=document.getElementById('dm33style');style.disabled=!active;
    if(active){drawMap=dm33drawMap;btn.textContent='◐ Diseño: 3.5';}
    else {btn.textContent='◐ Diseño: 3.5 (pulsa para activar)';}
   });
  })();`);
  // Avoid srcdoc accidentally closing at HTML parse boundaries inside this launcher.
  frame.srcdoc = game;
  frame.addEventListener('load',()=>status.style.display='none',{once:true});
 }catch(err){
  status.innerHTML='<strong>No se pudo cargar Barrio Vivo Plus 3.5.</strong><p>'+String(err.message).replace(/[<>&]/g,'')+'</p><p>La versión 2.9 no ha sido modificada.</p>';
 }
})();
</script></body></html>
